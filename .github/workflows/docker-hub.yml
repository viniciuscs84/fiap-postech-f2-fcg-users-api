name: Build and publish public image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/UsersAPI.Tests/UsersAPI.Tests.csproj --configuration Release
      - uses: docker/setup-buildx-action@v4
      - name: Validate image build
        if: github.event_name == 'pull_request' || vars.DOCKERHUB_USERNAME == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: fcg-users-api:ci
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish public image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fcg-users-api:main
            ${{ vars.DOCKERHUB_USERNAME }}/fcg-users-api:sha-${{ github.sha }}
